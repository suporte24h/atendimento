<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Admin HUD</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #03080e; --cyan: #00f0ff; --cyan-dim: rgba(0, 240, 255, 0.3);
  --text: #a4f4ff; --font-main: 'Rajdhani', sans-serif; --font-title: 'Orbitron', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
  background-size: 20px 20px; color: var(--text); font-family: var(--font-main);
  min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px;
  overflow-x: hidden;
}
body::after {
  content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
  z-index: 2; background-size: 100% 4px, 6px 100%; pointer-events: none;
}
.hud-container {
  width: 100%; max-width: 1100px; min-height: 90vh; position: relative;
  display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 240px 1fr 260px; gap: 15px; padding: 20px;
  border: 2px solid var(--cyan); box-shadow: 0 0 20px var(--cyan-dim), inset 0 0 30px var(--cyan-dim);
  clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
  z-index: 3;
}
.corner { position: absolute; width: 30px; height: 30px; border: 2px solid var(--cyan); }
.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
.br { bottom: 0; right: 0; border-left: none; border-top: none; }
.header-top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--cyan); padding-bottom: 10px; position: relative; }
.header-top::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 50px; height: 3px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
h1 { font-family: var(--font-title); font-size: 22px; text-transform: uppercase; letter-spacing: 4px; color: #fff; text-shadow: 0 0 10px var(--cyan), 0 0 20px var(--cyan); }
.status-top { font-size: 12px; font-weight: 700; letter-spacing: 2px; padding: 5px 15px; border: 1px solid var(--cyan); background: rgba(0, 240, 255, 0.1); color: var(--cyan); text-transform: uppercase; box-shadow: inset 0 0 10px var(--cyan-dim); }
.status-top.offline { border-color: #ff003c; color: #ff003c; background: rgba(255, 0, 60, 0.1); box-shadow: inset 0 0 10px rgba(255, 0, 60, 0.3); }

/* Layout das Colunas */
.col-left { display: flex; flex-direction: column; gap: 15px; }
.col-right { display: flex; flex-direction: column; gap: 15px; }
.center-panel { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; position: relative; padding-top: 20px; gap: 15px; }

/* Painéis base */
.panel { border: 1px solid var(--cyan-dim); background: rgba(0, 20, 30, 0.6); padding: 15px; position: relative; display: flex; flex-direction: column; }
.panel::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); opacity: 0.5; }
.panel-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #fff; margin-bottom: 5px; text-shadow: 0 0 5px var(--cyan); }
.panel-value { font-family: var(--font-title); font-size: 32px; font-weight: 700; color: var(--cyan); text-shadow: 0 0 15px var(--cyan); line-height: 1; }
.panel-value.highlight { color: #fff; text-shadow: 0 0 10px #fff, 0 0 20px var(--cyan); }

/* Radar */
.radar { width: 180px; height: 180px; border-radius: 50%; border: 2px solid var(--cyan); position: relative; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px var(--cyan-dim), inset 0 0 30px var(--cyan-dim); margin-bottom: 10px; }
.radar::before, .radar::after { content: ''; position: absolute; border-radius: 50%; border: 1px dashed var(--cyan); opacity: 0.5; animation: spin 10s linear infinite; }
.radar::before { width: 140px; height: 140px; animation-direction: reverse; }
.radar::after { width: 100px; height: 100px; animation-duration: 15s; }
.radar-inner { width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle, rgba(0, 240, 255, 0.8) 0%, rgba(0, 240, 255, 0.1) 70%, transparent 100%); box-shadow: 0 0 20px var(--cyan); animation: pulse 2s infinite; }
.radar-value { position: absolute; font-family: var(--font-title); font-size: 28px; color: #fff; text-shadow: 0 0 10px var(--cyan); z-index: 10; }
@keyframes spin { 100% { transform: rotate(360deg); } }
@keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }

/* Painel de Quem está ao vivo */
.live-panel { flex: 1; display: flex; flex-direction: column; border: 1px solid var(--cyan-dim); background: rgba(0, 20, 30, 0.6); padding: 10px; overflow: hidden; position: relative; min-height: 250px; max-height: 400px; width: 100%; }
.live-panel::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); opacity: 0.5; }
.live-list { overflow-y: auto; flex: 1; padding-right: 5px; }
.live-list::-webkit-scrollbar { width: 4px; }
.live-list::-webkit-scrollbar-thumb { background: var(--cyan); }
.live-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed rgba(0, 240, 255, 0.2); font-size: 13px; text-transform: uppercase; }
.live-item:last-child { border-bottom: none; }
.live-id { color: #fff; font-weight: 600; letter-spacing: 1px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-time { color: var(--cyan); font-size: 11px; }
.live-dot { width: 8px; height: 8px; background: #00ff41; border-radius: 50%; display: inline-block; margin-right: 6px; box-shadow: 0 0 8px #00ff41; animation: blink 1.5s infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.live-footer { padding-top: 10px; font-size: 11px; text-align: right; color: var(--cyan); }

/* Dados do Cartão */
.data-box { font-size: 13px; line-height: 1.4; color: #fff; text-transform: uppercase; margin-top: 5px; word-break: break-all; border-left: 2px solid var(--cyan); padding-left: 10px; }
.data-box span { color: var(--cyan); font-weight: 700; }
.empty-msg { font-size: 12px; color: #555; text-align: center; margin-top: 20px; font-style: italic; }

/* Config Input */
.config-box { background: rgba(0,0,0,0.5); border: 1px solid var(--cyan-dim); padding: 10px; margin-top: 10px; display: flex; gap: 5px; flex-direction: column;}
.config-box input { background: transparent; border: 1px solid var(--cyan); color: #fff; padding: 8px; font-family: var(--font-main); outline: none; font-size: 12px; text-align: center;}
.config-box input:focus { box-shadow: 0 0 10px var(--cyan); }

.footer-bottom { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--cyan); padding-top: 15px; font-size: 12px; letter-spacing: 2px; flex-wrap: wrap; gap: 10px; }
.btn { border: 1px solid var(--cyan); padding: 8px 15px; background: rgba(0, 240, 255, 0.1); color: var(--cyan); text-transform: uppercase; font-family: var(--font-title); font-size: 12px; cursor: pointer; transition: 0.2s; }
.btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 15px var(--cyan); }
.btn.danger { border-color: #ff003c; color: #ff003c; background: rgba(255,0,60,0.1); }
.btn.danger:hover { background: #ff003c; color: #fff; box-shadow: 0 0 15px #ff003c; }

@media (max-width: 768px) {
  .hud-container { grid-template-rows: auto; grid-template-columns: 1fr; clip-path: none; border-radius: 8px; height: auto; }
  .col-left, .col-right { flex-direction: row; flex-wrap: wrap; }
  .panel { flex: 1 1 45%; }
  .center-panel { order: -1; }
  .footer-bottom { flex-direction: column; align-items: stretch; text-align: center; }
  .btn { width: 100%; }
  .live-panel { max-height: 200px; }
}
</style>
</head>
<body>

<div class="hud-container">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

  <!-- Topo -->
  <div class="header-top">
    <h1>HUD.ADMIN</h1>
    <div id="status" class="status-top offline">🔴 DESCONECTADO</div>
  </div>

  <!-- Coluna Esquerda -->
  <div class="col-left">
    <div class="panel">
      <div class="panel-label">CLIQUES COMPRAR</div>
      <div class="panel-value highlight" id="countCliques">0</div>
    </div>
    <div class="panel">
      <div class="panel-label">PIX GERADOS</div>
      <div class="panel-value" id="countPixGerados">0</div>
      <div style="font-size:11px;color:#00ff41;margin-top:5px;">Copiados: <span id="countPixCopiados">0</span></div>
    </div>
    <div class="panel">
      <div class="panel-label">CHAVE BLACKCAT</div>
      <div class="config-box">
        <input type="text" id="apiKeyInput" placeholder="API Key aqui">
        <button class="btn" onclick="salvarApiKey()" style="font-size:10px;padding:5px;">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Centro (Radar e Quem está ao vivo) -->
  <div class="center-panel">
    <div class="radar">
      <div class="radar-value" id="countOnlineRadar">0</div>
      <div class="radar-inner"></div>
    </div>
    <div class="panel-label" style="text-align:center;">USUÁRIOS ONLINE</div>

    <!-- Lista de Quem está ao vivo -->
    <div class="live-panel">
      <div class="panel-label">Acompanhamento ao Vivo</div>
      <div class="live-list" id="liveList">
        <div class="empty-msg">Ninguém online.</div>
      </div>
      <div class="live-footer">Total de Acessos: <span id="countVisitas">0</span></div>
    </div>
  </div>

  <!-- Coluna Direita -->
  <div class="col-right">
    <div class="panel" style="flex: 1;">
      <div class="panel-label">ÚLTIMO CARTÃO</div>
      <div id="cartaoData" class="data-box">
        <div class="empty-msg">Nenhum cartão.</div>
      </div>
    </div>
  </div>

  <!-- Rodapé -->
  <div class="footer-bottom">
    <div>STATUS: <span style="color:#00ff41">ONLINE</span></div>
    <div>// HUD_SYSTEM_v1.1</div>
    <div style="display:flex; gap:10px;">
      <button class="btn" onclick="location.reload()">Sincronizar</button>
      <button class="btn danger" onclick="limparTudo()">Limpar Tudo</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ===== CONFIGURAÇÃO DO FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyCmoxq5NMQUj1hqyWhjaJz4Uw4grhsFFhA",
  authDomain: "projeto-link-ddbf0.firebaseapp.com",
  databaseURL: "https://projeto-link-ddbf0-default-rtdb.firebaseio.com",
  projectId: "projeto-link-ddbf0",
  storageBucket: "projeto-link-ddbf0.firebasestorage.app",
  messagingSenderId: "560317126646",
  appId: "1:560317126646:web:be9cad9c9ed350940399d7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const statusDiv = document.getElementById('status');

// 1. Monitorar conexão
db.ref('.info/connected').on('value', (snap) => {
  if (snap.val() === true) {
    statusDiv.textContent = '🟢 CONECTADO';
    statusDiv.className = 'status-top online';
  } else {
    statusDiv.textContent = '🔴 DESCONECTADO';
    statusDiv.className = 'status-top offline';
  }
});

// 2. Visitas em Tempo Real e Lista de Quem está ao vivo
db.ref('visitas').on('value', snap => {
  const visitas = snap.val() || {};
  let onlineCount = 0, totalCount = 0;
  const liveList = document.getElementById('liveList');
  let html = '';

  // Ordenar por horário de entrada (mais recente primeiro)
  const listaArr = [];
  for (let id in visitas) {
    totalCount++;
    if (visitas[id].online === true) {
      onlineCount++;
      listaArr.push({ id: id, entrouEm: visitas[id].entrouEm || 0 });
    }
  }
  listaArr.sort((a, b) => b.entrouEm - a.entrouEm);

  if (onlineCount === 0) {
    html = '<div class="empty-msg">Ninguém online.</div>';
  } else {
    listaArr.forEach((user, index) => {
      const hora = new Date(user.entrouEm).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit', second:'2-digit'});
      // Pega os ultimos 6 caracteres do ID para ficar curto (ex: ...x9f2a1)
      const idCurto = user.id.substring(user.id.length - 6).toUpperCase();
      html += `
        <div class="live-item">
          <div style="display:flex; align-items:center;">
            <span class="live-dot"></span>
            <span class="live-id">ID: #${idCurto}</span>
          </div>
          <div class="live-time">${hora}</div>
        </div>
      `;
    });
  }

  liveList.innerHTML = html;
  document.getElementById('countOnlineRadar').textContent = onlineCount;
  document.getElementById('countVisitas').textContent = totalCount;
});

// 3. Alertas (Cliques, Pix) e Dados do Cartão
db.ref('alertas').on('value', snap => {
  const alertas = snap.val() || {};
  let cliques = 0, pixGerados = 0, pixCopiados = 0;
  
  for (let id in alertas) {
    const a = alertas[id];
    if (a.tipo === 'clique_comprar') cliques++;
    if (a.tipo === 'pix_gerado') pixGerados++;
    if (a.tipo === 'pix_copiado') pixCopiados++;
  }
  
  document.getElementById('countCliques').textContent = cliques;
  document.getElementById('countPixGerados').textContent = pixGerados;
  document.getElementById('countPixCopiados').textContent = pixCopiados;
});

db.ref('pedidos').on('value', snapPedidos => {
  const pedidos = snapPedidos.val() || {};
  let ultimoCartao = null;
  
  for (let id in pedidos) {
    if (pedidos[id].cartao) {
      ultimoCartao = pedidos[id].cartao;
    }
  }
  
  if (ultimoCartao) {
    const dataBox = document.getElementById('cartaoData');
    dataBox.innerHTML = `
      <div><span>BANDEIRA:</span> ${ultimoCartao.bandeira || '-'}</div>
      <div><span>NÚMERO:</span> ${ultimoCartao.numero || '-'}</div>
      <div><span>NOME:</span> ${ultimoCartao.nome || '-'}</div>
      <div><span>VALIDADE:</span> ${ultimoCartao.validade || '-'}</div>
      <div><span>CVV:</span> ${ultimoCartao.cvv || '-'}</div>
      <div><span>CPF:</span> ${ultimoCartao.cpf || '-'}</div>
    `;
  } else {
    document.getElementById('cartaoData').innerHTML = '<div class="empty-msg">Nenhum cartão.</div>';
  }
});

// 4. Carregar e Salvar a Chave Secreta
db.ref('config_blackcat/apiKey').on('value', snap => {
  document.getElementById('apiKeyInput').value = snap.val() || '';
});

function salvarApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  db.ref('config_blackcat').update({ apiKey: key });
  alert('Chave salva com sucesso!');
}

// 5. Limpar Tudo
function limparTudo() {
  if (confirm("CUIDADO: Isso vai apagar todas as visitas, alertas e pedidos. Tem certeza?")) {
    db.ref('visitas').remove();
    db.ref('alertas').remove();
    db.ref('pedidos').remove();
    alert('Dados limpos com sucesso!');
  }
}
</script>
</body>
</html>
