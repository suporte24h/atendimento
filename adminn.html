<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Admin HUD</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #020408;
  --cyan: #00f0ff;
  --cyan-dim: rgba(0, 240, 255, 0.2);
  --text: #b4f6ff;
  --text-dim: #4a8a99;
  --font-main: 'Rajdhani', sans-serif;
  --font-title: 'Orbitron', sans-serif;
  --font-code: 'Share Tech Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
  background-size: 30px 30px;
  color: var(--text); font-family: var(--font-main);
  min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px;
  overflow: hidden;
}
body::after {
  content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.05));
  z-index: 2; background-size: 100% 3px, 4px 100%; pointer-events: none;
}
.hud-container {
  width: 98vw; height: 96vh; max-width: 1800px; position: relative;
  display: grid; grid-template-rows: 80px 1fr 70px; grid-template-columns: 280px 1fr 300px; gap: 20px; padding: 30px;
  border: 2px solid var(--cyan); box-shadow: 0 0 30px rgba(0, 240, 255, 0.3), inset 0 0 50px rgba(0, 240, 255, 0.1);
  clip-path: polygon(30px 0, calc(50% - 50px) 0, calc(50% - 40px) 10px, calc(50% + 40px) 10px, calc(50% + 50px) 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 30px 100%, 0 calc(100% - 30px), 0 30px);
  z-index: 3;
}
.corner { position: absolute; width: 40px; height: 40px; border: 3px solid var(--cyan); }
.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
.br { bottom: 0; right: 0; border-left: none; border-top: none; }
.header-top {
  grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 2px solid var(--cyan-dim); padding-bottom: 15px; position: relative;
}
.header-top::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 200px; height: 4px; background: var(--cyan); box-shadow: 0 0 15px var(--cyan); }
h1 { font-family: var(--font-title); font-size: 28px; text-transform: uppercase; letter-spacing: 6px; color: #fff; text-shadow: 0 0 10px var(--cyan), 0 0 30px var(--cyan); }
h1 span { color: var(--cyan); font-size: 16px; vertical-align: middle; letter-spacing: 2px; margin-left: 10px; opacity: 0.7; }
.status-top { font-family: var(--font-code); font-size: 14px; font-weight: 700; letter-spacing: 3px; padding: 8px 20px; border: 1px solid var(--cyan); background: rgba(0, 240, 255, 0.1); color: var(--cyan); text-transform: uppercase; box-shadow: inset 0 0 15px var(--cyan-dim); }
.status-top.offline { border-color: #ff003c; color: #ff003c; background: rgba(255, 0, 60, 0.1); box-shadow: inset 0 0 15px rgba(255, 0, 60, 0.3); }
.col-left, .col-right { display: flex; flex-direction: column; gap: 20px; }
.center-panel { display: flex; flex-direction: column; align-items: stretch; gap: 20px; }
.panel { border: 1px solid var(--cyan-dim); background: rgba(0, 15, 25, 0.7); padding: 20px; position: relative; display: flex; flex-direction: column; box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.05); backdrop-filter: blur(5px); }
.panel::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--cyan); box-shadow: 0 0 15px var(--cyan); opacity: 0.6; }
.panel-label { font-family: var(--font-code); font-size: 12px; text-transform: uppercase; letter-spacing: 3px; color: #fff; margin-bottom: 15px; text-shadow: 0 0 5px var(--cyan); display: flex; align-items: center; gap: 8px; }
.panel-label::before { content: '>'; color: var(--cyan); }
.panel-value { font-family: var(--font-title); font-size: 52px; font-weight: 900; color: var(--cyan); text-shadow: 0 0 20px var(--cyan); line-height: 1; }
.panel-value.highlight { color: #fff; text-shadow: 0 0 15px #fff, 0 0 30px var(--cyan); }

/* Config Input */
.config-box { background: rgba(0,0,0,0.5); border: 1px solid var(--cyan-dim); padding: 15px; margin-top: 15px; display: flex; gap: 10px; flex-direction: column;}
.config-box input { background: rgba(0, 240, 255, 0.05); border: 1px solid var(--cyan); color: #fff; padding: 12px; font-family: var(--font-code); outline: none; font-size: 14px; text-align: center; transition: 0.3s; }
.config-box input:focus { box-shadow: 0 0 15px var(--cyan); background: rgba(0, 240, 255, 0.1); }

.bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 70px; margin-top: 20px; }
.bar { flex: 1; background: var(--cyan); box-shadow: 0 0 15px var(--cyan); opacity: 0.6; }
.radar-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 0; }
.radar { width: 250px; height: 250px; border-radius: 50%; border: 2px solid var(--cyan); position: relative; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px var(--cyan-dim), inset 0 0 40px var(--cyan-dim); }
.radar::before, .radar::after { content: ''; position: absolute; border-radius: 50%; border: 2px dashed var(--cyan); opacity: 0.4; animation: spin 12s linear infinite; }
.radar::before { width: 200px; height: 200px; animation-direction: reverse; border-style: dotted; }
.radar::after { width: 150px; height: 150px; animation-duration: 8s; border-width: 1px; }
.radar-inner { width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(0, 240, 255, 0.9) 0%, rgba(0, 240, 255, 0.2) 50%, transparent 100%); box-shadow: 0 0 30px var(--cyan); animation: pulse 2s infinite; }
.radar-value { position: absolute; font-family: var(--font-title); font-size: 48px; font-weight: 700; color: #fff; text-shadow: 0 0 20px var(--cyan); z-index: 10; }
@keyframes spin { 100% { transform: rotate(360deg); } }
@keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }
.live-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 250px; }
.live-list { overflow-y: auto; flex: 1; padding-right: 10px; }
.live-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 10px; border-bottom: 1px solid rgba(0, 240, 255, 0.1); font-family: var(--font-code); font-size: 14px; }
.live-id { color: #fff; font-weight: 600; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
.live-time { color: var(--cyan); font-size: 12px; }
.live-dot { width: 10px; height: 10px; background: #00ff41; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px #00ff41; animation: blink 1.5s infinite; }
@keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
.data-box { font-family: var(--font-code); font-size: 14px; line-height: 1.6; color: #fff; text-transform: uppercase; word-break: break-all; border-left: 3px solid var(--cyan); padding-left: 15px; }
.data-box span { color: var(--cyan); font-weight: 700; }
.empty-msg { font-family: var(--font-code); font-size: 14px; color: var(--text-dim); text-align: center; margin-top: 20px; }
.footer-bottom { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--cyan-dim); padding-top: 15px; font-family: var(--font-code); font-size: 12px; letter-spacing: 2px; flex-wrap: wrap; gap: 15px; color: var(--text-dim); }
.btn { border: 1px solid var(--cyan); padding: 10px 20px; background: rgba(0, 240, 255, 0.1); color: var(--cyan); text-transform: uppercase; font-family: var(--font-title); font-size: 12px; cursor: pointer; transition: 0.3s; font-weight: 700; letter-spacing: 2px; }
.btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 20px var(--cyan); }
.btn.danger { border-color: #ff003c; color: #ff003c; background: rgba(255, 0, 60, 0.1); }
.btn.danger:hover { background: #ff003c; color: #fff; box-shadow: 0 0 20px #ff003c; }

@media (max-width: 1024px) {
  .hud-container { grid-template-columns: 1fr; grid-template-rows: auto; height: auto; overflow: visible; clip-path: none; border-radius: 15px; padding: 20px; }
  .col-left, .col-right { flex-direction: row; flex-wrap: wrap; }
  .panel { flex: 1 1 45%; }
  .center-panel { order: -1; }
  .radar { width: 200px; height: 200px; }
  .footer-bottom { flex-direction: column; align-items: stretch; text-align: center; }
  .btn { width: 100%; margin-bottom: 10px; }
}
</style>
</head>
<body>

<div class="hud-container">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

  <div class="header-top">
    <h1>HUD.ADMIN <span>// v2.5</span></h1>
    <div id="status" class="status-top offline">🔴 OFFLINE</div>
  </div>

  <div class="col-left">
    <div class="panel">
      <div class="panel-label">Cliques Comprar</div>
      <div class="panel-value highlight" id="countCliques">0</div>
    </div>
    
    <div class="panel">
      <div class="panel-label">Pix Gerados</div>
      <div class="panel-value" id="countPix">0</div>
    </div>

    <div class="panel">
      <div class="panel-label">Chave Blackcat</div>
      <div class="config-box">
        <input type="text" id="apiKeyInput" placeholder="Insira a chave aqui">
        <button class="btn" onclick="salvarApiKey()" style="font-size:10px;padding:10px;">Salvar</button>
      </div>
    </div>
  </div>

  <div class="center-panel">
    <div class="radar-container">
      <div class="radar">
        <div class="radar-value" id="countOnlineRadar">0</div>
        <div class="radar-inner"></div>
      </div>
      <div class="panel-label" style="margin-top: 20px;">Usuários Online</div>
    </div>

    <div class="panel live-panel">
      <div class="panel-label">Acompanhamento ao Vivo</div>
      <div class="live-list" id="liveList">
        <div class="empty-msg">Ninguém online no momento.</div>
      </div>
      <div style="font-family: var(--font-code); font-size: 12px; text-align: right; color: var(--cyan); margin-top: 15px; border-top: 1px dashed var(--cyan-dim); padding-top: 10px;">
        Total de Acessos: <span id="countVisitas" style="font-size: 16px; font-weight: 700;">0</span>
      </div>
    </div>
  </div>

  <div class="col-right">
    <div class="panel" style="flex: 1;">
      <div class="panel-label">Último Cartão Recebido</div>
      <div id="cartaoData" class="data-box">
        <div class="empty-msg">Nenhum cartão.</div>
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    <div style="display: flex; gap: 20px;">
      <span>SYS_STATUS: <span style="color:#00ff41">NOMINAL</span></span>
    </div>
    <div>// TERMINAL_ID: 0x00A4B9</div>
    <div style="display:flex; gap:15px;">
      <button class="btn" onclick="location.reload()">Sincronizar</button>
      <button class="btn danger" onclick="limparTudo()">Limpar Tudo</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCmoxq5NMQUj1hqyWhjaJz4Uw4grhsFFhA",
  authDomain: "projeto-link-ddbf0.firebaseapp.com",
  databaseURL: "https://projeto-link-ddbf0-default-rtdb.firebaseio.com",
  projectId: "projeto-link-ddbf0",
  storageBucket: "projeto-link-ddbf0.firebasestorage.app",
  messagingSenderId: "560317126646",
  appId: "1:560317126646:web:be9cad9c9ed350940399d7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const statusDiv = document.getElementById('status');

db.ref('.info/connected').on('value', (snap) => {
  if (snap.val() === true) {
    statusDiv.textContent = '🟢 ONLINE';
    statusDiv.className = 'status-top online';
  } else {
    statusDiv.textContent = '🔴 OFFLINE';
    statusDiv.className = 'status-top offline';
  }
});

db.ref('visitas').on('value', snap => {
  const visitas = snap.val() || {};
  let onlineCount = 0, totalCount = 0;
  const liveList = document.getElementById('liveList');
  let html = '';
  const listaArr = [];

  for (let id in visitas) {
    totalCount++;
    if (visitas[id].online === true) {
      onlineCount++;
      listaArr.push({ id: id, entrouEm: visitas[id].entrouEm || 0 });
    }
  }
  listaArr.sort((a, b) => b.entrouEm - a.entrouEm);

  if (onlineCount === 0) {
    html = '<div class="empty-msg">Ninguém online no momento.</div>';
  } else {
    listaArr.forEach((user) => {
      const hora = new Date(user.entrouEm).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit', second:'2-digit'});
      const idCurto = user.id.substring(user.id.length - 6).toUpperCase();
      html += `<div class="live-item"><div class="live-id"><span class="live-dot"></span>ID: #${idCurto}</div><div class="live-time">${hora}</div></div>`;
    });
  }
  liveList.innerHTML = html;
  document.getElementById('countOnlineRadar').textContent = onlineCount;
  document.getElementById('countVisitas').textContent = totalCount;
});

db.ref('alertas').on('value', snap => {
  const alertas = snap.val() || {};
  let cliques = 0, pix = 0;
  for (let id in alertas) {
    const a = alertas[id];
    if (a.tipo === 'clique_comprar') cliques++;
    if (a.tipo === 'pix_gerado') pix++;
  }
  document.getElementById('countCliques').textContent = cliques;
  document.getElementById('countPix').textContent = pix;
});

db.ref('pedidos').on('value', snapPedidos => {
  const pedidos = snapPedidos.val() || {};
  let ultimoCartao = null;
  for (let id in pedidos) {
    if (pedidos[id].cartao) {
      ultimoCartao = pedidos[id].cartao;
    }
  }
  if (ultimoCartao) {
    document.getElementById('cartaoData').innerHTML = `
      <div><span>BANDEIRA:</span> ${ultimoCartao.bandeira || '-'}</div>
      <div><span>NÚMERO:</span> ${ultimoCartao.numero || '-'}</div>
      <div><span>NOME:</span> ${ultimoCartao.nome || '-'}</div>
      <div><span>VALIDADE:</span> ${ultimoCartao.validade || '-'}</div>
      <div><span>CVV:</span> ${ultimoCartao.cvv || '-'}</div>
      <div><span>CPF:</span> ${ultimoCartao.cpf || '-'}</div>
    `;
  } else {
    document.getElementById('cartaoData').innerHTML = '<div class="empty-msg">Nenhum cartão.</div>';
  }
});

// Salvar a Chave da Blackcat
db.ref('config_blackcat/apiKey').on('value', snap => {
  document.getElementById('apiKeyInput').value = snap.val() || '';
});

function salvarApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  db.ref('config_blackcat').update({ apiKey: key });
  alert('Chave salva com sucesso!');
}

// Limpar Tudo
function limparTudo() {
  if (confirm("CUIDADO: Isso vai apagar todas as visitas, alertas e pedidos. Tem certeza?")) {
    db.ref('visitas').remove();
    db.ref('alertas').remove();
    db.ref('pedidos').remove();
    alert('Dados limpos com sucesso!');
  }
}
</script>
</body>
</html>
