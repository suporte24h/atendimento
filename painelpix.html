<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackcat Terminal // Pix</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #030408;
        --cyan: #00f0ff;
        --cyan-dim: rgba(0, 240, 255, 0.2);
        --magenta: #ff00c8;
        --green: #00ff41;
        --red: #ff003c;
        --text: #a4f4ff;
        --font-main: 'Share Tech Mono', monospace;
        --font-title: 'Orbitron', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg);
        background-image: 
            linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
        background-size: 30px 30px;
        color: var(--text);
        font-family: var(--font-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overflow: hidden;
    }

    /* Efeito de Scanline */
    body::after {
        content: " ";
        display: block;
        position: fixed;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 2;
        background-size: 100% 4px, 6px 100%;
        pointer-events: none;
    }

    .container {
        background: rgba(5, 10, 15, 0.85);
        backdrop-filter: blur(15px);
        border: 1px solid var(--cyan-dim);
        border-radius: 4px;
        padding: 35px;
        width: 100%;
        max-width: 500px;
        position: relative;
        box-shadow: 0 0 30px rgba(0, 240, 255, 0.1), inset 0 0 50px rgba(0, 240, 255, 0.05);
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
    }

    /* Cantos HUD */
    .container::before, .container::after {
        content: ''; position: absolute; width: 20px; height: 20px; border: 2px solid var(--cyan);
    }
    .container::before { top: 0; left: 0; border-right: none; border-bottom: none; }
    .container::after { bottom: 0; right: 0; border-left: none; border-top: none; }

    h1 {
        font-family: var(--font-title);
        font-size: 24px;
        text-transform: uppercase;
        letter-spacing: 4px;
        color: #fff;
        text-shadow: 0 0 10px var(--cyan), 0 0 20px var(--cyan);
        text-align: center;
        margin-bottom: 5px;
        animation: flicker 3s infinite;
    }

    p.sub {
        text-align: center;
        color: var(--text);
        opacity: 0.5;
        font-size: 12px;
        letter-spacing: 2px;
        margin-bottom: 30px;
        text-transform: uppercase;
    }

    @keyframes flicker {
        0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; text-shadow: 0 0 10px var(--cyan), 0 0 20px var(--cyan); }
        20%, 22%, 24%, 55% { opacity: 0.5; text-shadow: none; }
    }

    .campo { margin-bottom: 20px; position: relative; }

    label {
        display: block;
        font-size: 11px;
        color: var(--cyan);
        margin-bottom: 8px;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 5px var(--cyan-dim);
    }
    label::before { content: '> '; }

    input {
        width: 100%;
        padding: 14px;
        background: rgba(0, 240, 255, 0.05);
        border: 1px solid var(--cyan-dim);
        border-radius: 2px;
        font-size: 16px;
        color: #fff;
        font-family: var(--font-main);
        outline: none;
        transition: 0.3s;
        letter-spacing: 1px;
    }

    input:focus {
        border-color: var(--cyan);
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        background: rgba(0, 240, 255, 0.1);
    }
    input::placeholder { color: rgba(164, 244, 255, 0.3); }

    button {
        width: 100%;
        padding: 16px;
        background: transparent;
        color: var(--cyan);
        border: 2px solid var(--cyan);
        border-radius: 2px;
        font-size: 16px;
        font-weight: 700;
        font-family: var(--font-title);
        text-transform: uppercase;
        letter-spacing: 3px;
        cursor: pointer;
        margin-top: 10px;
        position: relative;
        overflow: hidden;
        transition: 0.3s;
        box-shadow: inset 0 0 10px var(--cyan-dim);
    }

    button:hover {
        background: var(--cyan);
        color: #000;
        box-shadow: 0 0 20px var(--cyan), inset 0 0 20px var(--cyan);
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; border-color: var(--text); color: var(--text); }

    .resultado {
        margin-top: 30px;
        display: none;
        flex-direction: column;
        align-items: center;
        border-top: 1px dashed var(--cyan-dim);
        padding-top: 25px;
        animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .qrcode-box {
        background: #fff;
        padding: 15px;
        border-radius: 4px;
        margin-bottom: 20px;
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }

    .copia-cola {
        width: 100%;
        padding: 14px;
        font-size: 12px;
        border: 1px solid var(--cyan-dim);
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.5);
        color: var(--text);
        word-break: break-all;
        text-align: center;
        margin-bottom: 10px;
        font-family: var(--font-main);
    }

    .btn-copiar {
        background: transparent;
        color: var(--green);
        border-color: var(--green);
        box-shadow: inset 0 0 10px rgba(0, 255, 65, 0.2);
        margin-top: 0;
    }
    .btn-copiar:hover { background: var(--green); color: #000; box-shadow: 0 0 20px var(--green); }

    .log {
        margin-top: 25px;
        padding: 15px;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid var(--cyan-dim);
        border-radius: 2px;
        font-family: var(--font-main);
        font-size: 12px;
        color: var(--text);
        display: none;
        max-height: 200px;
        overflow-y: auto;
    }

    .log.error { border-color: var(--red); color: var(--red); box-shadow: 0 0 10px rgba(255, 0, 60, 0.2); }
    .log.success { border-color: var(--green); color: var(--green); box-shadow: 0 0 10px rgba(0, 255, 65, 0.2); }
    .log pre { white-space: pre-wrap; word-break: break-all; line-height: 1.5; }

    /* Scrollbar Customizada */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); }
    ::-webkit-scrollbar-thumb { background: var(--cyan-dim); }
</style>
</head>
<body>

<div class="container">
    <h1>SYS.PIX.GENERATOR</h1>
    <p class="sub">// BLACKCAT GATEWAY INTERFACE v2.0 //</p>
    
    <div class="campo">
        <label>AUTH_KEY :: API KEY</label>
        <input type="password" id="apiKey" placeholder="sk_...">
    </div>

    <div class="campo">
        <label>TARGET_VALUE :: VALOR (R$)</label>
        <input type="text" id="valor" placeholder="0,00" inputmode="numeric">
    </div>

    <div class="campo">
        <label>ENTITY_NAME :: NOME (Opcional)</label>
        <input type="text" id="nomeCliente" placeholder="João da Silva">
    </div>

    <div class="campo">
        <label>ENTITY_ID :: CPF (Opcional)</label>
        <input type="text" id="cpfCliente" placeholder="Apenas números">
    </div>

    <button id="btnGerar" onclick="gerarPix()">[ EXECUTAR GERAR PIX ]</button>

    <div id="resultado" class="resultado">
        <div class="qrcode-box" id="qrcode"></div>
        <div class="copia-cola" id="copiaCola"></div>
        <button class="btn-copiar" onclick="copiar()">[ COPIAR CÓDIGO PIX ]</button>
    </div>

    <div id="log" class="log"><pre id="logContent"></pre></div>
</div>

<script>
    // Formata o valor enquanto digita
    document.getElementById('valor').addEventListener('input', function(e) {
        let v = e.target.value.replace(/\D/g, '');
        v = (v / 100).toFixed(2) + '';
        v = v.replace('.', ',');
        v = v.replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.');
        e.target.value = v;
    });

    function mostrarLog(msg, tipo) {
        const log = document.getElementById('log');
        const content = document.getElementById('logContent');
        log.style.display = 'block';
        log.className = 'log ' + (tipo || '');
        content.textContent = msg;
        log.scrollTop = log.scrollHeight;
    }

    async function gerarPix() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const valorInput = document.getElementById('valor').value;
        const nomeCliente = document.getElementById('nomeCliente').value.trim() || 'Cliente Teste';
        const cpfCliente = document.getElementById('cpfCliente').value.replace(/\D/g, '') || '12345678909';
        
        const btn = document.getElementById('btnGerar');
        const resultado = document.getElementById('resultado');

        if (!apiKey) {
            alert('ERRO: Insira a API Key da Blackcat.');
            return;
        }

        let valorNumerico = valorInput.replace(/\./g, '').replace(',', '.');
        if (!valorNumerico || isNaN(parseFloat(valorNumerico)) || parseFloat(valorNumerico) <= 0) {
            alert('ERRO: Insira um valor válido maior que zero.');
            return;
        }

        const valorCentavos = Math.round(parseFloat(valorNumerico) * 100);

        btn.disabled = true;
        btn.textContent = '> PROCESSANDO...';
        resultado.style.display = 'none';
        mostrarLog('> ESTABELECENDO CONEXÃO COM GATEWAY...', '');

        // Corpo da requisição
        const body = {
            amount: valorCentavos,
            currency: 'BRL',
            paymentMethod: 'PIX',
            items: [{ 
                title: 'Cobrança Pix', 
                unitPrice: valorCentavos, 
                quantity: 1, 
                tangible: true 
            }],
            customer: { 
                name: nomeCliente, 
                email: 'cliente@teste.com', 
                phone: '11999999999', 
                document: { number: cpfCliente, type: 'cpf' } 
            },
            shipping: { 
                name: nomeCliente, 
                street: 'Rua Teste', 
                number: '123', 
                complement: '', 
                neighborhood: 'Centro', 
                city: 'São Paulo', 
                state: 'SP', 
                zipCode: '01001000' 
            },
            pix: { expiresInDays: 1 },
            externalRef: 'teste_' + Date.now()
        };

        try {
            const resp = await fetch('https://api.blackcatoficial.com/api/sales/create-sale', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-API-Key': apiKey
                },
                body: JSON.stringify(body)
            });

            const data = await resp.json();
            
            mostrarLog('> STATUS HTTP: ' + resp.status + '\n> RESPOSTA:\n' + JSON.stringify(data, null, 2), resp.ok ? 'success' : 'error');

            if (!resp.ok || !data.success) {
                throw new Error(data.message || data.error || 'Erro na API da Blackcat');
            }

            const t = data.data || data;
            const pd = t.paymentData || t;
            const copia = pd.copyPaste || pd.qrCode || pd.pixCode || '';
            
            if (!copia) {
                throw new Error('A API não retornou o código Pix (copyPaste). Verifique o log acima.');
            }

            resultado.style.display = 'flex';
            document.getElementById('copiaCola').textContent = copia;

            document.getElementById('qrcode').innerHTML = '';
            new QRCode(document.getElementById('qrcode'), {
                text: copia,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            mostrarLog('> [SUCCESS] PIX GERADO.\n> TX_ID: ' + (t.transactionId || 'N/A'), 'success');

        } catch (err) {
            console.error(err);
            mostrarLog('> [FAILURE] ' + err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = '[ EXECUTAR GERAR PIX ]';
        }
    }

    function copiar() {
        const texto = document.getElementById('copiaCola').textContent;
        navigator.clipboard.writeText(texto).then(() => {
            alert('> CÓDIGO PIX COPIADO PARA A ÁREA DE TRANSFERÊNCIA.');
        }).catch(() => {
            const input = document.createElement('textarea');
            input.value = texto;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            alert('> CÓDIGO PIX COPIADO.');
        });
    }
</script>
</body>
</html>
